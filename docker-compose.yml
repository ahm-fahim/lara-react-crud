services:
  mysql:
    image: mysql:8.0
    container_name: lara-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lara_react_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: fahim
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: lara-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
    driver: local
